<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
<head>
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-itunes-app" content="app-id=6803948500">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
<title>%WEB_TITLE%</title>
<style>
html,body,#root{height:100%;margin:0}body{overflow:hidden}#root{display:flex;flex:1}
/* Native and web launch shells stay Stone until the saved theme mounts. */
html,body{background:#fafaf9}
@media(prefers-color-scheme:dark){html,body{background:#171717}}
</style>
<script>
(function () {
  try {
    var raw = window.localStorage.getItem('beeline.settings.local-settings');
    window.__beelineLaunchSettings = { raw: raw };
    var parsed = raw ? JSON.parse(raw) : null;
    var migrated = window.localStorage.getItem('beeline.settings.appearance-system-v1') === 'done';
    var choice = migrated && parsed ? parsed.appearance : 'system';
    if (choice === 'light' || choice === 'dark') {
      var style = document.createElement('style');
      style.textContent = 'html,body{background:' + (choice === 'dark' ? '#171717' : '#fafaf9') + '}';
      document.head.appendChild(style);
    }
  } catch (e) {}
})();
</script>
<script>
// While the bundle loads, open the app's live socket with the saved access and
// send the launch page's first read. LiveConnection adopts this socket and the
// read; nothing here renders or keeps data.
(function () {
  try {
    var access = JSON.parse(window.localStorage.getItem('buzzy.monolith.access.v1') || 'null');
    if (!access || typeof access.server !== 'string' || typeof access.token !== 'string' ||
        access.identityId !== window.localStorage.getItem('buzzy.monolith.identity.v1') ||
        !(access.expiresAt > Date.now() + 30000)) return;
    var path = window.location.pathname.replace(/\/+$/, '') || '/';
    var room = /^\/beeline\/chat\/([^/]+)$/.exec(path);
    var read = room ? { op: 'readRoom', args: { roomId: decodeURIComponent(room[1]) } }
      : /^\/(beeline\/(channels|community|create-workspace))?$/.test(path) ? { op: 'readWorkspaces', args: {} } : null;
    var url = access.server.replace(/^http/, 'ws') + '/v1/phone/live';
    var socket = new WebSocket(url, ['bearer.' + access.token]);
    var messages = [];
    var reads = [];
    var released = false;
    var sendRead = function () {
      if (released || !read || reads.length) return;
      socket.send(JSON.stringify({ t: 'req', id: 'launch-1', op: read.op, args: read.args }));
      reads.push({ id: 'launch-1', op: read.op, args: read.args });
    };
    var keep = function (event) {
      messages.push(event);
      if (!room) return;
      try {
        var frame = JSON.parse(event.data);
        if (frame && frame.type === 'subscribed' && frame.roomId === read.args.roomId) sendRead();
      } catch (e) {}
    };
    var opened = function () {
      if (released || !read) return;
      if (room) socket.send(JSON.stringify({ type: 'subscribe', roomIds: [read.args.roomId], sidebarPreviews: false, roomStateProjections: true }));
      else sendRead();
    };
    socket.addEventListener('message', keep);
    socket.addEventListener('open', opened, { once: true });
    window.__beelineLaunchLive = {
      url: url, token: access.token, path: window.location.pathname, socket: socket,
      reads: reads,
      // The adopter takes the frames received so far; later ones are its own.
      release: function () {
        released = true;
        socket.removeEventListener('message', keep);
        socket.removeEventListener('open', opened);
        return messages;
      },
    };
  } catch (e) {}
})();
</script>
</head>
<body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div></body>
</html>
