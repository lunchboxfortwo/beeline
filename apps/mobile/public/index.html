<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
<head>
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-itunes-app" content="app-id=6803948500">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no" />
<title>%WEB_TITLE%</title>
<style>
html,body,#root{height:100%;margin:0}body{overflow:hidden}#root{display:flex;flex:1}
/* Native and web launch shells stay Stone until the saved theme mounts. */
html,body{background:#fafaf9}
@media(prefers-color-scheme:dark){html,body{background:#171717}}
</style>
<script>
(function () {
  try {
    var raw = window.localStorage.getItem('beeline.settings.local-settings');
    window.__beelineLaunchSettings = { raw: raw };
    var parsed = raw ? JSON.parse(raw) : null;
    var migrated = window.localStorage.getItem('beeline.settings.appearance-system-v1') === 'done';
    var choice = migrated && parsed ? parsed.appearance : 'system';
    if (choice === 'light' || choice === 'dark') {
      var style = document.createElement('style');
      style.textContent = 'html,body{background:' + (choice === 'dark' ? '#171717' : '#fafaf9') + '}';
      document.head.appendChild(style);
    }
  } catch (e) {}
})();
</script>
<script>
// While the bundle loads, only open the app's live connection with saved access.
// This script sends no frames; LiveConnection adopts the socket and received frames.
(function () {
  try {
    var access = JSON.parse(window.localStorage.getItem('buzzy.monolith.access.v1') || 'null');
    if (!access || typeof access.server !== 'string' || typeof access.token !== 'string' ||
        access.identityId !== window.localStorage.getItem('buzzy.monolith.identity.v1') ||
        !(access.expiresAt > Date.now() + 30000)) return;
    var url = access.server.replace(/^http/, 'ws') + '/v1/phone/live';
    var socket = new WebSocket(url, ['bearer.' + access.token]);
    var messages = [];
    var keep = function (event) { messages.push(event); };
    socket.addEventListener('message', keep);
    window.__beelineLaunchLive = {
      url: url, token: access.token, socket: socket,
      // The adopter takes the frames received so far; later ones are its own.
      release: function () {
        socket.removeEventListener('message', keep);
        return messages;
      },
    };
  } catch (e) {}
})();
</script>
</head>
<body><noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div></body>
</html>
