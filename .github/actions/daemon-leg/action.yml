# Daemon leg of the unified release (was .github/workflows/beeline-bundle.yml).
# unified-release.yml calls it twice from the self-hosted production host:
# phase=collect combines the install-verified Linux and macOS native bundles,
# phase=promote publishes R2 and secondary Release assets and smoke-tests the exact manifest. Fleet
# uptake is asynchronous observability and never holds a release open. The
# caller installs Node 22 and root dependencies; each native builder owns
# its Rust toolchain.
name: Beeline daemon release leg
description: Collect verified native artifacts or publish them and prove the deployed update

inputs:
  channel:
    default: latest
  phase:
    description: collect | promote
    required: true
  release_sha:
    required: true
  release_version:
    required: true
  manifest_url:
    default: https://usebeeline.app/dl/manifest.json
  linux_bundle_dir:
    description: Downloaded install-verified Linux artifact directory
    default: ''
  darwin_arm64_bundle_dir:
    description: Downloaded native darwin-arm64 artifact directory
    default: ''
  darwin_x64_bundle_dir:
    description: Downloaded native darwin-x64 artifact directory
    default: ''

runs:
  using: composite
  steps:
    # ---- build -------------------------------------------------------------
    - name: Collect daemon artifact
      if: inputs.phase == 'collect'
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/daemon-leg.sh" step0
      env:
        BEELINE_ACTION_VALUE_0: ${{ inputs.linux_bundle_dir }}
        BEELINE_ACTION_VALUE_1: ${{ inputs.darwin_arm64_bundle_dir }}
        BEELINE_ACTION_VALUE_2: ${{ inputs.darwin_x64_bundle_dir }}
    # ---- promote -----------------------------------------------------------
    - name: Publish the selected public helper channel
      if: inputs.phase == 'promote'
      uses: actions/github-script@v7
      env:
        BUNDLE_DIR: ${{ runner.temp }}/daemon-release
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        CHANNEL: ${{ inputs.channel }}
      with:
        script: |
          const { run } = await import(`${process.env.GITHUB_WORKSPACE}/packages/scripts/release-steps/daemon-leg-step1.mjs`);
          await run({ github, core, context });
    - name: Prove a real helper update through the download route
      if: inputs.phase == 'promote'
      shell: bash
      env:
        MANIFEST_URL: ${{ inputs.manifest_url }}
        BEELINE_ACTION_VALUE_0: ${{ runner.temp }}
      run: >-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/daemon-leg.sh" step2
    - name: Record asynchronous fleet uptake without blocking the release
      if: inputs.phase == 'promote'
      shell: bash
      continue-on-error: true
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/daemon-leg.sh" step3
