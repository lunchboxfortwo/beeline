# Server leg of the unified release. unified-release.yml calls it once from the
# self-hosted production host: it builds and pushes the one Fly image, migrates
# once, and canaries the exact release SHA across the two Fly Machines. The
# caller checks out the release SHA and owns
# runner, timeout, and concurrency.
#
# Fly is the only memory: a rerun whose Machines already all run this release's
# image does nothing, and a fleet left split by an interrupted release is
# finished on the new image instead of refused. Each updated Machine records
# the image it replaced in its Fly metadata. The image and the image it
# replaced leave through step outputs; the release record keeps the previous
# published release's image as the rollback target.
name: Server release leg
description: Promote the exact server image and deploy it to Fly.io behind a canary

inputs:
  release_sha:
    required: true
  release_version:
    required: true
  free_agent_image_token:
    required: true
    description: Image-only authority to publish the matching free starter agent image
  previous_server_image_ref:
    required: false
    default: ''
    description: The newest published server image, which may differ from an unpublished serving attempt
  rollback_server_image_ref:
    required: false
    default: ''
    description: The older rollback image still named by the published release

outputs:
  image_ref:
    description: The image every Machine runs after this leg
    value: ${{ steps.fleet.outputs.image_ref }}
  previous_image_ref:
    description: The image the fleet ran before this leg (on a rerun, read from the Machines' metadata; empty if unknown)
    value: ${{ steps.fleet.outputs.previous_image_ref }}

runs:
  using: composite
  steps:
    - name: Verify Fly.io deployment authority
      shell: bash
      run: bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step0
    - name: Ask Fly whether this release already runs
      id: fleet
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" fleet
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
    - name: This release already runs on every Machine
      if: steps.fleet.outputs.shipped == 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step2
      env:
        BEELINE_ACTION_VALUE_0: ${{ steps.fleet.outputs.image_ref }}
    # Publish before the existing server rollout: staging a secret must never
    # cause a second restart after the release has already completed.
    - name: Install the free starter agent image build dependencies
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step3
    - uses: dtolnay/rust-toolchain@1.95.0
      if: steps.fleet.outputs.shipped != 'true'
    - uses: ./.github/actions/buzz-agent-cache
      if: steps.fleet.outputs.shipped != 'true'
      with:
        platform: linux-x64
    - name: Publish the matching free starter agent image
      id: free_agent_image
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" free_agent_image
      env:
        FLY_API_TOKEN: ${{ inputs.free_agent_image_token }}
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
    - name: Build the exact Fly image and capture the two-Machine rollback plan
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step8
      env:
        IMAGE_REF: ${{ steps.free_agent_image.outputs.image_ref }}
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}

    - name: Guard schema overlap with the serving and rollback images
      if: steps.fleet.outputs.shipped != 'true' || hashFiles('apps/server/contracts/*.sql') != ''
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step9
      env:
        PUBLISHED_SERVER_IMAGE: ${{ inputs.previous_server_image_ref }}
        ROLLBACK_SERVER_IMAGE: ${{ inputs.rollback_server_image_ref }}
        BEELINE_ACTION_VALUE_0: ${{ steps.fleet.outputs.image_ref }}

    - name: Run schema migrations and backfills once before Machine updates
      id: migrate
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" migrate
      env:
        BEELINE_ACTION_VALUE_0: ${{ steps.fleet.outputs.image_ref }}

    - name: Canary one Machine for ninety seconds, then update its peer
      if: steps.fleet.outputs.shipped != 'true'
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step11
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}

    - name: Run column contracts only after old Machines drain
      if: steps.fleet.outputs.shipped != 'true' || hashFiles('apps/server/contracts/*.sql') != ''
      shell: bash
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step12
      env:
        RELEASE_SHA: ${{ inputs.release_sha }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        BEELINE_ACTION_VALUE_0: ${{ steps.fleet.outputs.image_ref }}

    - name: Verify the free starter image and refresh its helpers without restarting servers
      shell: bash
      env:
        IMAGE_REF: ${{ steps.free_agent_image.outputs.image_ref }}
      run: |-
        bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/server-leg.sh" step13
