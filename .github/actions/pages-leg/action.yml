# Static marketing site only. Helper downloads are served by the Cloudflare
# /dl/* route from public Release assets; never upload archives to Pages.
name: Publish the static website on Cloudflare Pages
description: Deploy the static website without helper download bytes
inputs:
  branch:
    description: Pages branch to deploy
    required: false
    default: main
  deployment_json:
    description: File to receive the staged Pages preview and asset manifest
    required: false
    default: ''
  cloudflare_api_token:
    description: Cloudflare token with Pages Edit authority
    required: true
  cloudflare_account_id:
    description: Cloudflare account owning the usebeeline Pages project
    required: true
runs:
  using: composite
  steps:
    - name: Assemble the static website without helper downloads
      shell: bash
      run: bash "$GITHUB_WORKSPACE/packages/scripts/release-steps/pages-leg.sh" step0
    - name: Deploy the existing usebeeline Cloudflare Pages project
      uses: actions/github-script@v7
      env:
        PAGES_DEPLOYMENT_JSON: ${{ inputs.deployment_json }}
        PAGES_BRANCH: ${{ inputs.branch }}
        CLOUDFLARE_PAGES_TOKEN: ${{ inputs.cloudflare_api_token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
      with:
        script: |
          const { run } = await import(`${process.env.GITHUB_WORKSPACE}/packages/scripts/release-steps/pages-leg-step3.mjs`);
          await run({ context });
