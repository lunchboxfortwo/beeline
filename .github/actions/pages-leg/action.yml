# Static marketing site only. Helper downloads are served by the Cloudflare
# /dl/* route from public Release assets; never upload archives to Pages.
name: Publish the static website on Pages
description: Deploy the static website without helper download bytes
runs:
  using: composite
  steps:
    - name: Assemble the static website without helper downloads
      shell: bash
      run: node scripts/pages-site.mjs build --static-only --output-dir "$RUNNER_TEMP/usebeeline-pages"
    - uses: actions/configure-pages@v5
    # Keep rerun artifacts distinct.
    - uses: actions/upload-pages-artifact@v5
      id: pages-artifact
      with:
        name: github-pages-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/usebeeline-pages
        include-hidden-files: true
    - name: Deploy Pages with one immediate retry for an empty status
      uses: actions/github-script@v7
      env:
        PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
      with:
        script: |
          const { deployPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/deploy-pages.mjs`);
          const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
          if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Expected an uploaded Pages artifact ID');
          await deployPages({ github, repo: context.repo, artifactId,
            sha: context.sha, idToken: await core.getIDToken() });
