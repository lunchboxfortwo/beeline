name: Nightly Checks
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Unified production release run that is starting this nightly check
        required: false
        type: string
      release_sha:
        description: Released commit to check out and hand to Checks
        required: false
        type: string
permissions:
  contents: read
  actions: write
  checks: read
  issues: write
concurrency:
  group: nightly-checks
  cancel-in-progress: false
jobs:
  nightly:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dispatch every Checks suite
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node packages/scripts/nightly-checks.mjs
      - name: Publish nightly result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-checks-result
          path: nightly-checks.json
          if-no-files-found: ignore
          retention-days: 30
